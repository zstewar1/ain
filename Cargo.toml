[package]
name = "ain"
version = "0.1.1"
edition = "2024"
authors = ["Zachary Stewart <zachary.c.stewart@gmail.com>"]
description = "Case-insensitive mirror of the `ascii` crate"
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/zstewar1/ain"
documentation = "https://docs.rs/ain"
homepage = "https://docs.rs/ain"


[features]
default = ["std"]
std = ["alloc", "ascii/std"]
alloc = ["ascii/alloc"]

[dependencies]
ascii = { version = "1.1.0", default-features = false }
