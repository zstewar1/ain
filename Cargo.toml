[package]
name = "ain"
version = "0.1.1"
edition = "2024"
authors = ["Zachary Stewart <zachary.c.stewart@gmail.com>"]
description = "Case-insensitive mirror of the `ascii` crate"
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/zstewar1/ain"
documentation = "https://docs.rs/ain"

[package.metadata.docs.rs]
rustdocflags = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["std"]
std = ["alloc", "ascii?/std"]
alloc = ["ascii?/alloc"]
ascii = ["dep:ascii"]
nightly = []

[dependencies]
ascii = { version = "1.1.0", optional = true, default-features = false }
