[package]
name = "ain"
version = "0.2.0"
edition = "2024"
authors = ["Zachary Stewart <zachary.c.stewart@gmail.com>"]
description = "Case-insensitive ASCII-only versions of String, &str, and char"
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/zstewar1/ain"
documentation = "https://docs.rs/ain"
rust-version = "1.93"

[package.metadata.docs.rs]
rustdocflags = ["--cfg", "docsrs"]
all-features = true

[features]
default = ["std"]
std = ["alloc", "ascii?/std", "memchr/std"]
alloc = ["ascii?/alloc", "memchr/alloc"]
ascii = ["dep:ascii"]
nightly = []

[dependencies]
ascii = { version = "1.1.0", optional = true, default-features = false }
memchr = { version = "2.8.3", default-features = false }

[dev-dependencies]
hashbrown = "0.17.1"
